an tata bahasa dan typo?\&quot;&quot;,&quot;\&quot;Apakah motif penulisan artikel tersebut mengandung bias komersial?\&quot;&quot;],&quot;correctIndex&quot;:0},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Seorang siswa menemukan artikel kesehatan yang sangat sesuai dengan tugas sekolahnya tentang \&quot;manfaat imunisasi\&quot;. Berdasarkan kriteria CRAAP, evaluasi siswa terhadap kesesuaian konten tersebut dengan topik tugas yang sedang dikerjakannya merupakan perwujudan dari kriteria...&quot;,&quot;hint&quot;:&quot;Perhatikan keterkaitan langsung antara isi informasi dan topik kajian yang dibutuhkan.&quot;,&quot;choices&quot;:[&quot;Currency&quot;,&quot;Relevance&quot;,&quot;Authority&quot;,&quot;Accuracy&quot;,&quot;Purpose&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Dalam Metode CRAAP (Currency, Relevance, Authority, Accuracy, Purpose), apa yang dimaksud dengan komponen Authority (Otoritas)?&quot;,&quot;hint&quot;:&quot;Pertimbangkan latar belakang pembuat informasi dan platform penerbitnya.&quot;,&quot;choices&quot;:[&quot;Mengevaluasi seberapa baru informasi tersebut berdasarkan tahun publikasinya&quot;,&quot;Memeriksa kualifikasi penulis, kredibilitas lembaga penerbit, dan reputasi domain pengelolanya&quot;,&quot;Mengukur seberapa cocok informasi dengan kebutuhan riset&quot;,&quot;Menganalisis niat sebenarnya penulis ketika menulis artikel&quot;,&quot;Memastikan dokumen tersebut tidak disunting atau diubah pihak luar&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Ketika melakukan teknik membaca lateral (lateral reading) untuk mengevaluasi sebuah postingan di media sosial yang mencurigakan, tindakan manakah yang harus dilakukan pertama kali oleh seorang siswa?&quot;,&quot;hint&quot;:&quot;Ciri khas membaca lateral adalah tidak berdiam di halaman asli melainkan memverifikasi ke luar.&quot;,&quot;choices&quot;:[&quot;Membaca naskah postingan tersebut secara linear dari atas ke bawah berulang kali&quot;,&quot;Memperhatikan logo profesional dan desain visual internal yang tertera pada postingan&quot;,&quot;Keluar dari situs atau postingan asal, membuka tab baru, dan memverifikasi klaim di situs periksa fakta atau sumber bereputasi&quot;,&quot;Langsung membagikan naskah postingan tersebut ke grup obrolan agar diverifikasi orang lain&quot;,&quot;Menolak mengaktifkan fitur cookie pada peramban yang digunakan&quot;],&quot;correctIndex&quot;:2},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Seorang peneliti menemukan artikel jurnal ilmiah bereputasi tentang dampak krisis iklim. Namun, ia membaca keterangan bahwa artikel jurnal tersebut belum melewati proses peninjauan sejawat (peer-review) oleh para ahli di bidangnya. Tindakan paling tepat yang harus dilakukan peneliti tersebut adalah...&quot;,&quot;hint&quot;:&quot;Jurnal tanpa peninjauan sejawat memerlukan pemeriksaan silang tambahan.&quot;,&quot;choices&quot;:[&quot;Langsung mengutip jurnal tersebut karena diterbitkan oleh penerbit terkenal&quot;,&quot;Melakukan validasi lebih lanjut sebelum memutuskan untuk mengutip jurnal tersebut&quot;,&quot;Mengabaikan jurnal tersebut sepenuhnya karena tidak menggunakan format dokumen PDF&quot;,&quot;Melaporkan penulis jurnal tersebut kepada aparat kepolisian atas dasar pelanggaran UU ITE&quot;,&quot;Mengubah seluruh isi abstrak jurnal agar sesuai dengan opini pribadi peneliti&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Pemerintah Indonesia secara tegas melarang penyebaran berita bohong yang menyesatkan di dunia maya. Regulasi hukum yang mengatur sanksi pidana terhadap pelaku penyebaran hoaks diatur dalam...&quot;,&quot;hint&quot;:&quot;Aturan ini berkaitan dengan Informasi dan Transaksi Elektronik.&quot;,&quot;choices&quot;:[&quot;UU Nomor 28 Tahun 2014 Pasal 40 tentang Hak Cipta&quot;,&quot;UU ITE Nomor 11 Tahun 2008 Pasal 45A ayat (1)&quot;,&quot;WTO Agreement tentang Hak Atas Kekayaan Intelektual (HaKI)&quot;,&quot;Undang-Undang No. 3 Tahun 2017 tentang Perbukuan Nasional&quot;,&quot;UU Nomor 19 Tahun 2016 tentang Revisi UU ITE Pasal 40 ayat (2)&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Melalui pemahaman CRAAP dan strategi membaca lateral, siswa dilatih berpikir kritis agar tidak mudah terjebak oleh infodemi atau klaim sepihak. Apa tujuan utama dari ekosistem periksa fakta di masyarakat digital?&quot;,&quot;hint&quot;:&quot;Fokus pada penyaringan kebenaran dan pencegahan disinformasi secara kolaboratif.&quot;,&quot;choices&quot;:[&quot;Untuk mempercepat penyebaran informasi agar lebih cepat dibaca publik&quot;,&quot;Untuk menyaring dan memvalidasi fakta sekaligus membendung berita bohong (hoaks) di dunia digital&quot;,&quot;Untuk menghapus seluruh berita digital yang ada di internet&quot;,&quot;Untuk mengganti peran jurnalis profesional di media tradisional&quot;,&quot;Untuk mengenkripsi semua data penting agar tidak dapat dilacak&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Ketika menyusun analisis data, seorang siswa menemukan dua data statistik yang bertolak belakang mengenai \&quot;angka pengangguran\&quot; dari dua kementerian resmi pemerintah yang sama-sama kredibel. Tindakan manakah yang paling tepat dilakukan siswa tersebut?&quot;,&quot;hint&quot;:&quot;Analisis landasan pengumpulan data dan batasan variabel dari kedua pihak.&quot;,&quot;choices&quot;:[&quot;Memilih data yang persentasenya paling menyenangkan hati pribadi siswa&quot;,&quot;Mengabaikan kedua data tersebut dan mencari artikel opini di media sosial&quot;,&quot;Memeriksa metodologi pengumpulan data dan konteks di balik data dari kedua kementerian tersebut&quot;,&quot;Mengambil nilai rata-rata dari kedua data tersebut tanpa menganalisis prosesnya&quot;,&quot;Melaporkan salah satu kementerian ke portal aduan siber karena dianggap menyebarkan hoaks&quot;],&quot;correctIndex&quot;:2},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Seorang siswa kelas X ingin membeli buku panduan belajar pemrograman. Di toko buku, ia menemukan e-book bajakan yang ditawarkan secara ilegal dengan harga sangat murah. Dari perspektif moral dan hukum HaKI, tindakan paling bijaksana yang harus diambil siswa adalah...&quot;,&quot;hint&quot;:&quot;Cari opsi yang taat hukum sekaligus mendukung kebiasaan belajar ekonomis secara etis.&quot;,&quot;choices&quot;:[&quot;Membeli e-book bajakan tersebut karena menghemat anggaran belajarnya&quot;,&quot;Menolak membeli versi bajakan dan mencari alternatif perangkat ajar/buku bersertifikat resmi atau berlisensi terbuka (open source) yang gratis dan legal&quot;,&quot;Membeli e-book bajakan tersebut lalu membagikannya secara gratis di media sosial&quot;,&quot;Meminta penjual buku menonaktifkan fitur enkripsi file e-book bajakan tersebut&quot;,&quot;Membeli e-book tersebut hanya jika format dokumennya berupa PDF&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Apa bahaya terbesar dari kecenderungan psikologis bias konfirmasi (confirmation bias) ketika seorang siswa melakukan verifikasi kebenaran artikel di internet?&quot;,&quot;hint&quot;:&quot;Kecenderungan ini membuat orang hanya menerima fakta yang ia sukai.&quot;,&quot;choices&quot;:[&quot;Siswa menjadi terlalu cepat bosan saat membaca teks ilmiah yang panjang&quot;,&quot;Siswa hanya akan aktif mengumpulkan bukti internet yang mendukung opini pribadinya sendiri dan menolak fakta tandingan yang sebenarnya kredibel&quot;,&quot;Peramban komputer otomatis mematikan koneksi internet akibat muatan data berlebih&quot;,&quot;Siswa terancam melanggar hukum hak cipta UU ITE karena membaca artikel opini&quot;,&quot;Server database mesin pencari Google otomatis memblokir IP address milik siswa&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Dalam konteks jurnalisme digital, mengapa periksa fakta dianggap lebih penting daripada era jurnalisme tradisional? Karena jurnalisme digital...&quot;,&quot;hint&quot;:&quot;Kemudahan akses membuat siapa saja bisa mempublikasikan konten tanpa saringan ketat.&quot;,&quot;choices&quot;:[&quot;lebih cepat dalam menyebarkan informasi secara berulang-ulang&quot;,&quot;lebih mengutamakan opini daripada fakta objektif&quot;,&quot;memungkinkan lebih banyak orang untuk menjadi jurnalis tanpa pelatihan formal&quot;,&quot;sudah memiliki mekanisme periksa fakta otomatis di setiap web&quot;,&quot;memungkinkan hanya penerbit terkenal yang mempublikasikan konten&quot;],&quot;correctIndex&quot;:2},{&quot;type&quot;:&quot;pgk&quot;,&quot;question&quot;:&quot;Tentukan apakah setiap pernyataan berikut Benar atau Salah berdasarkan metode evaluasi CRAAP dan prinsip ekosistem periksa fakta!&quot;,&quot;statements&quot;:[{&quot;text&quot;:&quot;Protokol HTTPS menggunakan enkripsi SSL/TLS untuk melindungi keamanan data transmisi pengguna, tetapi protokol ini tidak menjamin kebenaran isi dari informasi yang dipublikasikan di dalam website tersebut.&quot;,&quot;answer&quot;:true},{&quot;text&quot;:&quot;Metode membaca vertikal lebih direkomendasikan daripada membaca lateral untuk mendeteksi keaslian artikel kesehatan karena metode ini berfokus menilai keindahan logo dan kesaksian di halaman \&quot;About Us\&quot;.&quot;,&quot;answer&quot;:false},{&quot;text&quot;:&quot;Evaluasi kriteria Accuracy dalam tes CRAAP terpenuhi apabila sebuah dokumen tertulis menyertakan rujukan ilmiah yang logis, disajikan secara profesional, serta bebas dari kesalahan tata bahasa dan typo.&quot;,&quot;answer&quot;:true},{&quot;text&quot;:&quot;Fenomena ledakan infodemi di era Masyarakat 5.0 terjadi karena kemudahan publikasi digital secara instan tanpa adanya proses penyaringan (filter) ketat seperti pada media informasi tradisional.&quot;,&quot;answer&quot;:true},{&quot;text&quot;:&quot;Lisensi Creative Commons (CC BY-NC) memperbolehkan pengguna menyalin dan menyebarluaskan suatu karya ilmiah secara bebas, termasuk menggunakannya untuk tujuan komersial atau bisnis pribadi tanpa izin khusus.&quot;,&quot;answer&quot;:false},{&quot;text&quot;:&quot;Jurnalisme pemeriksaan fakta dalam jurnalisme digital berfokus pada bagaimana cerita itu diceritakan secara utuh beserta konteksnya, bukan sekadar kutipan pernyataan semata.&quot;,&quot;answer&quot;:true}]},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Manakah pernyataan berikut yang bukan bagian dari komponen ekonomi digital yang benar terkait ekosistem periksa fakta? (Pilih dua opsi)&quot;,&quot;hint&quot;:&quot;Cari opsi yang bertentangan atau berupa instrumen regulasi/perilaku menyimpang.&quot;,&quot;choices&quot;:[&quot;Organisasi Periksa Fakta Independen seperti CekFakta.com dan Turnbackhoax.id&quot;,&quot;Jurnalis dan Peneliti yang secara aktif menyaring kebenaran berita&quot;,&quot;Platform media sosial yang memantau aliran konten dan menandai postingan menyesatkan&quot;,&quot;Publik yang menyebarkan hoaks tanpa verifikasi terlebih dahulu&quot;,&quot;Instrumen hukum seperti UU ITE Pasal 45A ayat (1)&quot;],&quot;correctAnswers&quot;:[2,4]},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Membaca lateral (lateral reading) dan membaca vertikal merupakan dua cara berbeda dalam mengevaluasi informasi digital. Manakah opsi-opsi yang benar terkait perbedaan utama di antara keduanya? (Pilih lebih dari satu opsi)&quot;,&quot;hint&quot;:&quot;Perhatikan fokus pemeriksaan internal vs verifikasi eksternal serta aspek kecepatannya.&quot;,&quot;choices&quot;:[&quot;Membaca Vertikal: hanya membaca satu halaman dari atas ke bawah dan mengandalkan visual internal&quot;,&quot;Membaca Lateral: keluar dari situs web, membuka tab baru, dan mencari konsensus sumber luar tepercaya&quot;,&quot;Membaca Vertikal lebih andal karena tidak perlu membuka banyak tab baru&quot;,&quot;Membaca Lateral lebih lambat karena harus membuka banyak sumber berbeda&quot;],&quot;correctAnswers&quot;:[0,1,3]},{&quot;type&quot;:&quot;matching&quot;,&quot;question&quot;:&quot;Pasangkanlah kriteria evaluasi ilmiah CRAAP di lajur kiri dengan deskripsi pertanyaan pengujinya yang tepat di lajur kanan!&quot;,&quot;leftItems&quot;:[&quot;Currency (Keaktualan)&quot;,&quot;Relevance (Relevansi)&quot;,&quot;Accuracy (Keakuratan)&quot;,&quot;Purpose (Tujuan)&quot;],&quot;rightItems&quot;:[&quot;Apakah ada bias kepentingan terselubung atau motif komersial di balik penerbitan artikel tersebut?&quot;,&quot;Apakah informasi tersebut berkaitan erat dan penting untuk menjawab topik tugas sekolah saya?&quot;,&quot;Kapan dokumen siber tersebut diterbitkan, dan apakah datanya masih mutakhir?&quot;,&quot;Apakah sumber tersebut menyajikan argumen pendukung yang logis dan bebas dari kesalahan typo?&quot;],&quot;correctPairs&quot;:{&quot;0&quot;:2,&quot;1&quot;:1,&quot;2&quot;:3,&quot;3&quot;:0}}]" _attempt-ke="0" _soal-file-url-cache="./files/2026-stimulus1-faseE.json" _remidi-soal="[]" _tab-switch-count="0" _visibility-change-count="0" _window-blur-count="0" _window-focus-count="0" _warning-count="0" _skor="26" _best-skor="26" _pernah-ikut="" _terkunci="false"   ></latihan-kuis>
