  <hr/><h3 id="h3--2136781867"><strong>4. Miskonsepsi Umum</strong></h3>

  <ul><li><strong>Miskonsepsi 1: Tampilan situs web yang rapi, berlogo
  profesional, dan menggunakan protokol HTTPS sudah pasti
  kredibel.</strong><em>Faktanya:</em> Ini merupakan jebakan metode membaca
  vertikal. Elemen visual internal sangat mudah dipalsukan secara digital oleh
  pembuat hoaks. Protokol HTTPS hanya menjamin enkripsi transmisi data agar aman
  dari penyadapan, tetapi tidak menjamin kebenaran isi atau validitas informasi
  di dalam web tersebut.</li>







   <li><strong>Miskonsepsi 2: Metadata EXIF pada gambar bersifat permanen dan dapat dipercaya 100% karena datanya sangat detail.</strong><em>Faktanya:</em> Metadata EXIF sangat rentan dihapus, disunting, atau dimanipulasi secara sengaja oleh pembuat hoaks menggunakan perangkat lunak penyunting sebelum diunggah kembali ke internet.</li>







   <li><strong>Miskonsepsi 3: Menghindari hoaks cukup dilakukan dengan membaca teks secara saksama dari awal hingga akhir paragraf.</strong><em>Faktanya:</em> Membaca saksama dalam satu situs (Membaca Vertikal) tetap membuat pembaca rawan terjebak jika informasi yang disajikan ditulis dengan gaya bahasa meyakinkan namun fiktif. Verifikasi hoaks mutlak memerlukan <strong>Membaca Lateral</strong> dengan melompat ke tab lain untuk mencari konsensus sumber luar.</li>







  </ul>

  <hr/><h3 id="h3-1891844905"><strong>5. Ringkasan Materi</strong></h3>

  <ol><li><strong>Membaca Lateral</strong> melatih kita untuk melompat keluar
  dari situs web asal dan membuka beberapa tab baru guna melacak reputasi
  penulis serta mencari konsensus dari berbagai sumber luar tepercaya.</li>







   <li><strong>Metode Triangulasi</strong> meminimalkan bias subjektif dan menghindari bias konfirmasi dengan membandingkan minimal tiga sumber, metode, atau peneliti yang berbeda.</li>







   <li><strong>Kredibilitas visual (gambar)</strong> wajib diuji secara kritis menggunakan <em>Reverse Image Search</em> dan pemeriksaan metadata EXIF karena aspek visual sangat mudah dimanipulasi secara digital oleh pembuat hoaks.</li>







   <li><strong>Konflik data</strong> dari instansi kredibel yang kontradiktif diselesaikan dengan cara meneliti metodologi pengumpulan data dan konteks data dari masing-masing sumber.</li>







  </ol>

