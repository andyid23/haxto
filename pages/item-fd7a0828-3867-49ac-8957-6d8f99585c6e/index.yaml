  <hr/><h3 id="h3--679071797"><strong><br></strong>


  </h3>

  <h3 id="h3--679071797"><strong>6. Materi Pembelajaran (Skenario Aktivitas
  Mandiri)</strong></h3>

  <h4 id="h4--1435987985"><strong>Wacana Kasus Uji Verifikasi:</strong></h4>

  <blockquote><p>Seorang siswa kelas XI menemukan postingan viral di media
  sosial yang menampilkan foto "kerusakan jalan raya akibat gempa bumi hari ini
  di sebuah daerah". Postingan tersebut menyertakan link artikel dari sebuah
  blog pribadi yang merinci kronologi kejadian dengan desain tata letak yang
  sangat rapi dan berlogo instansi kedokteran tepercaya.</p></blockquote>

  <h4 id="h4-2071373031"><strong>Panduan Langkah Eksplorasi Siswa:</strong></h4>

  <p>Siswa diarahkan untuk membedah kasus di atas secara kritis menggunakan
  langkah-langkah sistematis berikut:</p>

  <ol><li><strong>Menerapkan Membaca Lateral:</strong> Siswa segera keluar dari
  link blog tersebut, membuka tab baru di peramban, dan mencari tahu reputasi
  penulis blog serta kebenaran klaim gempa bumi hari ini menurut instansi resmi
  seperti BMKG atau BNPB.</li>







   <li><strong>Melakukan Reverse Image Search:</strong> Siswa mengunduh gambar kerusakan jalan tersebut dan mengunggahnya ke mesin pencari gambar (seperti Google Lens). Jika hasil pencarian menunjukkan bahwa gambar tersebut adalah foto kerusakan akibat gempa di negara lain pada tahun 2018, maka terbukti bahwa foto tersebut digunakan di luar konteks asli (hoaks konteks).</li>







   <li><strong>Menganalisis Kriteria Kebenaran Visual:</strong> Siswa meneliti objek foto untuk mendeteksi tanda-tanda penyuntingan piksel, manipulasi pencahayaan, atau bayangan yang tidak konsisten yang menunjukkan adanya rekayasa gambar.</li>







   <li><strong>Menguji dengan Triangulasi Sumber:</strong> Siswa memverifikasi kesaksian berita tersebut dengan membandingkan data dari minimal tiga portal berita kredibel yang independen, jurnal bencana yang telah di-<em>peer-review</em>, dan situs pemerintah resmi agar terhindar dari bias konfirmasi pribadi.</li>







  </ol>

