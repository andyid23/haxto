  <h4 id="h4--322459575"><strong>D. Mengatasi Konflik Data
  Kontradiktif</strong></h4>

  <p>Apabila kita menemukan data statistik yang kontradiktif dari dua instansi
  pemerintah tepercaya (misalnya dua kementerian resmi), tindakan yang benar
  adalah <strong>memeriksa secara mendalam metodologi pengumpulan
  datanya</strong> serta konteks di balik pembuatan informasi dari kedua sumber
  tersebut, alih-alih langsung mengambil kesimpulan sepihak.</p>

