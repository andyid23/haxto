  <p></p>

  <p>Selain itu, aspek keamanan penjelajahan juga ditunjang oleh penggunaan
  protokol <strong>HTTPS</strong> yang dianggap lebih aman dan kredibel dalam
  interaksi informasi digital. HTTPS menambahkan lapisan keamanan dengan
  menggunakan protokol <strong>SSL/TLS</strong> yang mengenkripsi data yang
  dikirimkan antara klien dan server, sehingga melindunginya dari penyadapan
  pihak ketiga yang tidak sah. Namun, penting untuk dipahami bahwa HTTPS hanya
  menjamin keamanan jalur transmisi data, bukan kebenaran isi atau validitas
  informasi di dalam situs tersebut.</p>

  <h4 id="h4--1686091933"><strong>B. Metode Triangulasi dalam Validasi
  Data</strong></h4>

  <p><strong>Triangulasi</strong> adalah metode ilmiah yang digunakan untuk
  memperkuat validitas data dengan cara <strong>menggabungkan minimal tiga
  sumber, metode, atau peneliti berbeda</strong>. Di dunia digital, penerapan
  taktis metode ini sangat penting untuk melindungi diri dari jebakan
  <strong>bias konfirmasi</strong> (<em>confirmation bias</em>), yaitu kesalahan
  berpikir tidak sadar di mana seseorang hanya aktif mencari bukti di internet
  yang mendukung opini pribadinya sembari mengabaikan fakta bertolak belakang
  yang kredibel.</p>

  <p></p>

  <ul><li><strong>Triangulasi Metode:</strong> Menggunakan teknik pengumpulan
  data yang berbeda untuk memverifikasi hal yang sama (misalnya menggabungkan
  wawancara, observasi lapangan, dan analisis dokumen tertulis).</li>







   <li><strong>Triangulasi Sumber:</strong> Membandingkan keabsahan informasi dengan merujuk pada beberapa sumber data independen yang berbeda (misalnya membandingkan kesaksian tokoh, data survei, dan dokumen resmi kementerian).</li>







   <li><strong>Triangulasi Peneliti (<em>Investigator Triangulation</em>):</strong>







   Melibatkan beberapa peneliti atau pengamat independen untuk mengevaluasi data yang sama guna mengurangi bias subjektif personal dan memastikan interpretasi data bersifat objektif.</li>







  </ul>

