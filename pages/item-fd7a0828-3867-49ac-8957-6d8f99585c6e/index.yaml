  <h2 id="h2--879066373"><strong>TOPIK: VERIFIKASI INFORMASI DAN PERIKSA FAKTA
  (LITERASI DIGITAL)</strong></h2>

  <hr/><h3 id="h3-39465782"><strong>1. Pendahuluan</strong></h3>

  <p>Informatika merupakan disiplin ilmu yang mencari pemahaman terhadap konsep
  inti serta implementasi dari sistem komputasi, jaringan, dan kecakapan digital
  di era modern. Di tengah pesatnya perkembangan teknologi informasi, masyarakat
  saat ini hidup di era di mana alam nyata dan alam digital saling terintegrasi.
  Kondisi ini memicu terjadinya fenomena ledakan informasi digital yang mencakup
  berita akurat maupun berita bohong (hoaks) yang menyebar secara masif dan
  cepat.</p>

  <p>Kemampuan berpikir kritis dan literasi digital menjadi prasyarat mutlak
  bagi setiap warga digital agar mampu menyikapi beragam data yang tersedia di
  internet secara bijak. Melalui pemahaman yang mendalam tentang verifikasi
  informasi, peserta didik tidak hanya terhindar dari disinformasi yang
  merugikan, tetapi juga mampu membangun ketahanan terhadap manipulasi informasi
  di dunia maya.</p>

  <hr/><h3 id="h3-468844443"><strong>2. Tujuan Pembelajaran</strong></h3>

  <p>Berdasarkan Capaian Pembelajaran (CP) elemen Literasi Digital Fase F,
  sasaran kompetensi khusus pada topik ini adalah:</p>

  <ul><li>Peserta didik mampu <strong>menggunakan cara membaca lateral
  (<em>lateral reading</em>)</strong>







   untuk mengevaluasi informasi digital yang kompleks.</li>







   <li>Peserta didik mampu <strong>mengevaluasi kebenaran konten</strong> menggunakan verifikasi teks, gambar, dan video secara kritis.</li>







   <li>Peserta didik mampu <strong>menerapkan metode ilmiah seperti triangulasi</strong> untuk menguji keandalan dan validitas sumber data.</li>







  </ul>

  <hr/><h3 id="h3-272661673"><strong>3. Materi dan Konsep Dasar</strong></h3>

  <h4 id="h4-1091508119"><strong>A. Membaca Lateral (<em>Lateral Reading</em>)
  vs. Membaca Vertikal</strong>








  </h4>

  <p>Ketika mengevaluasi informasi digital di internet, banyak pengguna terjebak
  pada metode <strong>Membaca Vertikal</strong>, yaitu cara membaca satu halaman
  web dari atas ke bawah secara saksama sembari mengandalkan visual
  internal&#8212;seperti logo profesional, tata letak yang rapi, atau halaman
  *"About Us"*&#8212;untuk menilai kredibilitas. Padahal, seluruh fitur internal
  tersebut sangat mudah dimanipulasi atau dipalsukan oleh pembuat hoaks.</p>

  <p>Sebagai solusi, peserta didik harus menerapkan <strong>Membaca
  Lateral</strong> (<em>lateral reading</em>), yaitu strategi mengevaluasi
  kredibilitas informasi dengan cara <strong>keluar dari situs web atau
  postingan yang sedang dibaca, membuka beberapa tab baru di peramban</strong>,
  dan mencari konsensus atau sudut pandang dari berbagai sumber independen
  tepercaya mengenai organisasi, penulis, atau klaim tersebut.</p>

