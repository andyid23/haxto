  <h4 id="h4-65100422"><strong>C. Verifikasi Kredibilitas Konten Gambar (Visual)
  &amp; Metadata EXIF</strong></h4>

  <p>Kredibilitas informasi visual berupa gambar tidak boleh dinilai hanya dari
  ketajaman atau keindahan estetikanya. Validitas gambar dapat diuji melalui
  tiga pendekatan ilmiah:</p>

  <ol><li><strong>Reverse Image Search (Pencarian Gambar Terbalik):</strong>
  Menggunakan alat bantu visual untuk membandingkan file gambar yang diunggah
  dengan basis data gambar di internet guna melacak riwayat publikasi pertama.
  Teknik ini sangat efektif untuk mendeteksi <strong>hoaks konteks</strong>, di
  mana gambar lama yang asli digunakan kembali secara tidak jujur di luar
  konteks waktu atau peristiwa aslinya.</li>







   <li><strong>Pemeriksaan Metadata EXIF (<em>Exchangeable Image File Format</em>):</strong>







   Memeriksa data teknis tersembunyi yang tertanam di dalam file gambar asli untuk membaca tanggal pembuatan, keterangan waktu (<em>timestamp</em>), hingga koordinat lokasi geografis GPS tempat foto tersebut diambil. Namun, data EXIF ini tidak boleh dipercaya secara mutlak karena <strong>sangat rentan dihapus, disunting, atau dimanipulasi secara sengaja</strong> menggunakan perangkat lunak tertentu sebelum diunggah kembali ke internet.</li>







   <li><strong>Evaluasi Kualitas Visual:</strong> Menganalisis aspek <strong>"Kebenaran Visual"</strong> untuk mendeteksi tanda-tanda manipulasi, rekayasa digital, atau penyuntingan yang tidak jujur pada objek gambar, serta aspek <strong>"Ketepatan Konten"</strong> untuk memastikan keselarasan visualisasi gambar dengan konteks berita yang dibahas.</li>







  </ol>

