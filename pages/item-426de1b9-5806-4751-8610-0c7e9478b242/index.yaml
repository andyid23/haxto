  <h2 id="h2-17200480">📘 Cara Mengerjakan Latihan Kuis</h2>

  <p>Simak materi dan pahami, lanjutkan soal latihan di bawah dengan login
  terlebih dahulu,
    harap refresh bila tombol mulai latihan soal tidak muncul setelah login.</p>
  <p></p>

  <p><b>1. Pendahuluan</b></p>

  <p><b>Informatika merupakan disiplin ilmu yang mencari pemahaman terhadap
  konsep inti serta implementasi dari sistem komputasi, rekayasa, dan kecakapan
  digital di era modern</b><b>. Di tengah derasnya arus informasi era Masyarakat
  5.0, kita sering kali dihadapkan pada fenomena infodemi, yaitu ledakan
  informasi dalam jumlah besar yang bercampur aduk antara berita yang akurat
  dengan berita bohong (hoaks) yang menyebar sangat cepat</b><b>.</b></p>

  <p><b>Oleh karena itu, kecakapan literasi digital bukan hanya mencakup
  keterampilan teknis mengoperasikan komputer, melainkan juga kemampuan berpikir
  kritis dalam mengevaluasi, memilah, dan memvalidasi kebenaran informasi
  digital sebelum membagikannya atau menjadikannya rujukan
  ilmiah</b><b>.</b></p>

  <p><b>2. Tujuan Pembelajaran</b></p>

  <p><b>Berdasarkan Capaian Pembelajaran (CP) dan Alur Tujuan Pembelajaran (ATP)
  Informatika Fase E (Kelas X), tujuan pembelajaran khusus pada topik ini
  adalah:</b></p>

  <ul><li><b>Siswa mampu menjelaskan ekosistem periksa fakta untuk memilah fakta
  dan bukan fakta di dunia digital</b><b>.</b></li>



  <li><b>Siswa mampu menggunakan cara membaca lateral (lateral reading) guna
  mengevaluasi keandalan berbagai informasi digital secara
  objektif</b><b>.</b></li>



  <li><b>Siswa mampu mengevaluasi validitas data dan kredibilitas sumber data
  dengan menerapkan instrumen evaluasi ilmiah seperti Metode
  CRAAP</b><b>.</b></li>



  </ul>

