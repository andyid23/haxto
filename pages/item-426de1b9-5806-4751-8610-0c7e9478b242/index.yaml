  <p><b>7. Materi Pembelajaran sesuai Stimulus 2</b></p>

  <p><b>Wacana Stimulus 2:</b></p>

  <p><b>"Penilaian kevalidan suatu data teks dapat diuji secara terstruktur
  menggunakan instrumen ilmiah yang disebut Metode CRAAP</b><b>. Metode ini
  membagi evaluasi ke dalam lima indikator utama, yaitu Currency (keaktualan),
  Relevance (relevansi), Authority (otoritas), Accuracy (keakuratan), dan
  Purpose (tujuan)</b><b>. Melalui pemahaman CRAAP, siswa dilatih berpikir
  kritis agar tidak mudah terjebak oleh opini subjektif atau klaim sepihak yang
  tidak didukung bukti ilmiah teruji</b><b>."</b></p>

  <p><b>Studi Kasus Penerapan Pembelajaran:</b></p>

  <p><b>Seorang siswa menemukan artikel kesehatan di sebuah blog tak dikenal
  yang mengklaim: "Minyak herbal tertentu 100% ampuh menyembuhkan segala macam
  virus dalam waktu 24 jam tanpa efek samping!"</b></p>

  <p><b>Siswa diajarkan untuk membedah artikel ini secara kritis:</b></p>

  <ul><li><b>Analisis Otoritas (Authority): Siswa menerapkan metode membaca
  lateral dengan membuka tab baru untuk memeriksa siapa penulis blog
  tersebut</b><b>. Apakah ia memiliki kualifikasi medis tepercaya, dan apakah
  situs tersebut menggunakan rujukan dari kementerian kesehatan resmi
  (.go.id)?</b></li>



  <li><b>Analisis Keakuratan (Accuracy): Siswa memverifikasi apakah klaim
  tersebut didukung oleh rujukan ilmiah atau jurnal yang telah
  di-peer-review</b><b>. Ia juga meneliti apakah teks disajikan secara
  profesional dan bebas dari banyak kesalahan tik (typo)</b><b>.</b></li>



  <li><b>Analisis Tujuan (Purpose): Siswa menganalisis apakah artikel tersebut
  memiliki bias komersial (tujuan terselubung untuk mempromosikan dan menjual
  produk minyak herbal tersebut secara sepihak tanpa memaparkan risiko medis
  secara berimbang)</b><b>.</b></li>



  <li><b>Triangulasi Data: Untuk menghindari bias konfirmasi (hanya memercayai
  apa yang disukai), siswa membandingkan klaim tersebut dengan minimal tiga
  sumber independen tepercaya di internet, seperti portal resmi WHO, jurnal
  kedokteran terakreditasi, dan situs portal periksa fakta
  (CekFakta.com)</b><b>.</b></li>



  </ul>

