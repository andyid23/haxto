  <p><b>B. Metode CRAAP dalam Mengevaluasi Konten Teks</b></p>

  <p><b="true">Kevalidan suatu dokumen teks dapat diuji secara terstruktur
  menggunakan instrumen ilmiah yang disebut Metode CRAAP, yang membagi evaluasi
  ke dalam lima indikator utama<b="true">:</b="true"></b="true">


  </p>

  <ol><li><b>Currency (Keaktualan): Mengevaluasi aspek waktu publikasi dan
  keaktualan informasi untuk mendeteksi apakah data tersebut masih mutakhir atau
  sudah usang</b><b>.</b></li>



  <li><b>Relevance (Relevansi): Menguji kesesuaian informasi dengan topik tugas
  atau pertanyaan riset yang sedang kita selesaikan</b><b>.</b></li>



  <li><b>Authority (Otoritas): Memeriksa kualifikasi penulis, kredibilitas
  lembaga penerbit, dan reputasi domain pengelolanya</b><b>. Untuk rujukan
  akademis di Indonesia, domain seperti .ac.id (institusi akademik) dan .go.id
  (lembaga kementerian pemerintah) memiliki tingkat otoritas data tepercaya
  tertinggi</b><b>.</b></li>



  <li><b>Accuracy (Keakuratan): Memverifikasi kebenaran isi dokumen. Dokumen
  yang akurat harus didukung bukti logis atau referensi ilmiah tepercaya,
  disajikan secara profesional, serta bebas dari kesalahan tata bahasa dan salah
  ketik (typo)</b><b>.</b></li>



  <li><b>Purpose (Tujuan): Menganalisis motif penulisan. Kita harus peka
  mendeteksi adanya bias komersial (seperti situs web yang murni bertujuan
  menjual produk tertentu sehingga cenderung menyajikan klaim sepihak tanpa
  menyajikan risiko secara berimbang)</b><b>.</b></li>



  </ol>

  <p><b>C. Strategi Membaca Lateral (Lateral Reading)</b></p>

  <p><b>Membaca lateral adalah strategi mengevaluasi kualitas informasi online
  dengan cara "keluar" dari situs web yang sedang dibaca, membuka tab baru di
  peramban, dan mencari konsensus atau ulasan dari berbagai sumber luar
  tepercaya mengenai organisasi, penulis, atau klaim tersebut</b><b>. </b></p>

  <p><b>Strategi ini bertolak belakang dengan Membaca Vertikal, yang hanya
  bertahan membaca satu halaman dari atas ke bawah serta mengandalkan visual
  internal (seperti logo profesional, tampilan rapi, dan halaman "About Us" yang
  padahal sangat mudah dipalsukan oleh pembuat hoaks)</b><b>.</b></p>

  <p><b>D. Peninjauan Sejawat (Peer-Review)</b></p>

  <p><b>Dalam riset ilmiah, memilih artikel jurnal tepercaya sangat
  penting</b><b>. Jurnal ilmiah yang belum melewati proses peninjauan sejawat
  (peer-review) oleh para ahli independen di bidangnya memiliki risiko keaslian
  data yang sangat tinggi</b><b>. Sebelum mengutipnya, kita wajib melakukan
  validasi lebih lanjut menggunakan studi pendukung sejenis</b><b>.</b></p>

  <p><b>4. Miskonsepsi Umum</b></p>

  <p><b>Miskonsepsi 1: Tampilan situs web yang rapi, berlogo profesional, dan
  mencantumkan testimoni internal di halaman "About Us" pasti kredibel.
  Faktanya: Ini merupakan risiko besar dari metode membaca vertikal</b><b>.
  Elemen visual internal sangat mudah dipalsukan secara digital oleh pembuat
  hoaks</b><b>. Evaluasi kredibilitas mutlak membutuhkan cara membaca
  lateral</b></p>

  <p><b>Miskonsepsi 2: Mencari informasi di internet hanya untuk mendukung apa
  yang sudah kita yakini sebelumnya. Faktanya: Sikap ini disebut Bias Konfirmasi
  (confirmation bias), yaitu kecenderungan psikologis tidak sadar di mana
  seseorang hanya aktif mencari bukti yang mendukung opini pribadinya dan
  mengabaikan fakta bertolak belakang yang kredibel</b><b>. Bias ini sangat
  merusak nalar kritis</b><b>.</b></p>

  <p><b>Miskonsepsi 3: Semua artikel di internet otomatis valid selama format
  dokumennya berupa PDF. Faktanya: Format dokumen (.pdf) hanyalah jenis berkas
  dan tidak menjamin validitas isi</b><b>. Data di dalamnya tetap harus
  dievaluasi menggunakan metode CRAAP, peninjauan sejawat (peer-review), serta
  kredibilitas domain penerbitnya</b><b>.</b></p>

  <p><b>5. Ringkasan Materi</b></p>

  <p><b="true">Infodemi dapat dibendung secara efektif melalui kerja sama
  terstruktur seluruh komponen ekosistem periksa fakta dan kepatuhan terhadap UU
  ITE Pasal 45A ayat (1)<b="true">.</b="true"></b="true">


  </p>

  <p><b>Metode CRAAP (Currency, Relevance, Authority, Accuracy, Purpose)
  membantu kita mengidentifikasi kredibilitas suatu naskah tertulis di internet
  secara objektif dan ilmiah</b><b>.</b></p>

