  <p><b>3. Materi dan Konsep Dasar</b></p>

  <p><b>A. Ekosistem Periksa Fakta &amp; Regulasi Hukum</b></p>

  <ul><li><b>Definisi Infodemi: Ledakan penyebaran informasi yang sangat cepat,
  baik yang akurat maupun yang berupa hoaks</b><b>.</b></li>



  <li><b>Komponen Ekosistem Periksa Fakta: Upaya kolaboratif nasional dan global
  untuk membendung hoaks, yang melibatkan</b><b>:</b></li>



  </ul>

  <ol><li><b>Organisasi Periksa Fakta Independen: Lembaga non-pemerintah yang
  berfokus memverifikasi klaim publik secara objektif (seperti CekFakta.com,
  Turnbackhoax.id, atau Snopes)</b><b>.</b></li>



  <li><b>Jurnalis dan Peneliti: Profesional media yang secara aktif menyaring
  dan melacak kebenaran berita</b><b>.</b></li>



  <li><b>Platform Media Sosial: Berkolaborasi memonitor aliran konten dan
  menandai postingan yang menyesatkan</b><b>.</b></li>



  <li><b>Publik: Peran aktif masyarakat untuk menyaring informasi dan menahan
  diri dari menyebarkan berita yang belum terbukti valid</b><b>.</b></li>



  </ol>

  <ul><li><b>Instrumen Hukum: Indonesia memiliki regulasi tegas yang melarang
  penyebaran berita bohong yang menyesatkan di dunia maya, yaitu UU ITE No. 11
  Tahun 2008 Pasal 45A ayat (1)</b><b>.</b></li>



  </ul>

