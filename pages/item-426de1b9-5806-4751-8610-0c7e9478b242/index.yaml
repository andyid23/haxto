  <h4 id="h4--664910474"><strong>TOPIK: OPTIMALISASI PENCARIAN LANJUTAN UNTUK
  RISET</strong></h4>

  <hr/><h3 id="h3-39465782"><strong>1. Pendahuluan</strong></h3>

  <p><span>Informatika merupakan disiplin ilmu yang mencari pemahaman terhadap
  konsep inti serta implementasi dari sistem komputer, jaringan, dan kecakapan
  digital. Di tengah arus transformasi digital yang mengalir deras, literasi
  digital dan kemampuan berpikir kritis menjadi prasyarat mutlak agar peserta
  didik memiliki bekal untuk menjadi warga digital yang berbudaya, beradab, dan
  produktif.</span> 
    </p>
  <p><span>Literasi digital mencakup kemampuan teknis dan kognitif untuk
  mengakses, mengatur, memahami, mengintegrasikan, mengevaluasi, dan mengkreasi
  informasi secara aman melalui teknologi digital. Salah satu keterampilan
  mendasar dalam literasi digital adalah kemampuan menjelajahi informasi secara
  cerdas dan memanfaatkan mesin pencari (search engine) untuk kepentingan riset
  akademik secara efektif dan efisien.</span> 
    </p>
  <hr/><h3 id="h3-468844443"><strong>2. Tujuan Pembelajaran</strong></h3>

  <p><span>Berdasarkan Capaian Pembelajaran (CP) dan Alur Tujuan Pembelajaran
  (ATP) Informatika Fase F, tujuan pembelajaran khusus pada topik ini
  adalah:</span> 
    </p>
  <ul>
      <li aria-level="1">Mampu memahami penggunaan mesin pencari secara optimal untuk melakukan riset akademik.</li>
      <li aria-level="1">Mampu menyusun strategi penelusuran informasi daring dengan menggunakan kata kunci
        presisi serta operator logika Boolean.</li>
        <li aria-level="1">Mampu menerapkan kombinasi variabel pencarian lanjutan (seperti site:, filetype:,
          dll.) untuk meningkatkan keandalan sumber data dan menghemat waktu riset.</li>
    </ul>
  <hr/><h3 id="h3-272661673"><strong>3. Materi dan Konsep Dasar</strong></h3>

  <h4 id="h4--549341882"><strong>A. Kebutuhan Riset Ilmiah Daring</strong></h4>

  <p><span>Riset adalah penyelidikan suatu masalah secara sistematis, kritis,
  dan ilmiah untuk mendapatkan fakta baru atau penafsiran yang lebih baik. Dalam
  melakukan riset, pencarian informasi daring menggunakan kata kunci sederhana
  sering kali tidak efektif karena menghasilkan jutaan data tidak relevan. Oleh
  karena itu, pemrogram dan peneliti harus menguasai strategi pencarian lanjutan
  untuk menyaring data secara presisi.</span> 
    </p>
  <h4 id="h4--1885554261"><strong>B. Operator Logika Boolean</strong></h4>

  <p><strong>Operator logika Boolean berperan penting dalam mengaitkan,
  membatasi, atau mengecualikan konsep penelusuran di mesin pencari:</strong> 
    </p>
  <ul>
      <li aria-level="1">AND: Digunakan untuk menggabungkan kata kunci guna mempersempit hasil pencarian
        data (memaksa mesin pencari menampilkan halaman yang hanya memuat semua kata kunci
        tersebut secara bersamaan).</li>
      <li aria-level="1">OR: Digunakan untuk memperluas pencarian dengan menampilkan hasil yang memuat salah
        satu atau kedua kata kunci sekaligus.</li>
      <li aria-level="1">NOT (atau karakter tanda minus -): Digunakan untuk mengecualikan kata kunci tertentu
        yang tidak relevan agar tidak muncul di halaman hasil penelusuran.</li>
    </ul>
  <h4 id="h4-690940071"><strong>C. Variabel Pencarian Lanjutan (Search
  Operators)</strong></h4>

  <p><strong>Variabel ini membatasi pelacakan kata kunci pada bagian spesifik
  dari dokumen atau server di internet:</strong>

    </p>
  <ul>
      <li aria-level="1">site:: Membatasi hasil pencarian hanya pada alamat web atau domain tertentu (misalnya,
        site:go.id untuk situs resmi pemerintah Indonesia atau site:ac.id untuk perguruan
        tinggi di Indonesia).</li>
      <li aria-level="1">filetype:: Menyaring hasil pencarian berdasarkan format dokumen berkas tertentu,
        seperti pdf untuk dokumen formal, doc, atau ppt.</li>
      <li aria-level="1">inurl:: Melacak kata kunci spesifik yang tertanam langsung di dalam alamat URL halaman
        web.</li>
      <li aria-level="1">intitle:: Membatasi pencarian halaman web yang judul dokumennya mengandung kata
        kunci tertentu.</li>
      <li aria-level="1">intext:: Mengunci pelacakan kata kunci khusus hanya di dalam badan teks (body) dokumen
        halaman web.</li>
      <li aria-level="1">cache:: Menampilkan versi salinan sementara terbaru dari suatu halaman web yang
        disimpan oleh server Google, sangat membantu di tengah keterbatasan koneksi internet.</li>
      <li aria-level="1">Tanda Petik Ganda (""): Digunakan untuk memaksa mesin pencari melacak frasa kata
        kunci secara tepat dan persis (Exact Match).</li>
    </ul>
  <h4 id="h4--2045198086"><strong>D. Teknologi Pencarian Modern</strong></h4>

  <ul>
      <li aria-level="1">
        <p><strong>Pencarian Visual (Google Lens): Teknologi penelusuran informasi non-teks yang didasarkan pada pencocokan data gambar/visual yang diunggah pengguna dengan sumber visual serupa di internet.</strong> 
        </p>


      </li>


    </ul>
  <hr/><h3 id="h3--2136781867"><strong>4. Miskonsepsi Umum</strong></h3>

  <ul>
      <li aria-level="1">Miskonsepsi 1: Mengetikkan kata kunci yang tidak berkaitan mempercepat proses riset.
        Faktanya: Kata kunci yang tidak berkaitan justru menghasilkan data sampah, merusak
        akurasi, serta menghambat efisiensi riset secara signifikan.</li>
      <li aria-level="1">Miskonsepsi 2: Penggunaan kata kunci yang terlampau spesifik dan sempit selalu dianjurkan.
        Faktanya: Kata kunci yang terlampau spesifik dan sempit dihindari karena berisiko
        menghilangkan informasi penting lainnya yang tersedia di bawah terminologi yang lebih
        umum.</li>
      <li aria-level="1">Miskonsepsi 3: Operator OR digunakan untuk menyaring dan mempersempit pencarian.
        Faktanya: Operator OR berfungsi untuk memperluas pencarian dengan menggabungkan alternatif
        istilah. Operator yang mempersempit ruang lingkup adalah AND.</li>
    </ul>
  <hr/><h3 id="h3-1891844905"><strong>5. Ringkasan Materi</strong></h3>

  <ol>
      <li aria-level="1">Pencarian riset ilmiah daring memerlukan teknik pencarian lanjutan agar terhindar
        dari tumpukan informasi tidak relevan.</li>
      <li aria-level="1">Operator logika Boolean (AND, OR, NOT/-) serta tanda petik ganda ("") mengontrol
        relevansi dan cakupan relasi antarkata kunci secara presisi.</li>
      <li aria-level="1">Variabel pencarian lanjutan seperti site: dan filetype: memfokuskan hasil pada reputasi
        domain akademik/pemerintah dan format dokumen siap unduh.</li>
      <li aria-level="1">Pencarian berbasis visual difasilitasi oleh Google Lens dengan mencocokkan kemiripan
        gambar secara daring.</li>
    </ol>
  <hr/><h3 id="h3-489287619"><strong>6. Materi Pembelajaran sesuai Stimulus
  1</strong></h3>

  <h4 id="h4--148070518"><strong>Wacana Stimulus 1:</strong></h4>

  <p>Pencarian informasi ilmiah secara daring menggunakan kata kunci sederhana
  sering
      kali tidak efektif karena menghasilkan jutaan data tidak relevan. Guna menyaring
      data secara presisi, pengguna dapat menerapkan variabel pencarian lanjutan seperti
      site: untuk domain web dan filetype: untuk format berkas. Selain itu, operator logika
      boolean (AND, OR, NOT) berperan penting dalam mengaitkan atau mengecualikan konsep
      penelusuran.<strong></strong>

    </p>
  <h4 id="h4-815904018"><strong>Studi Kasus Skenario Riset
  Akademik:</strong></h4>

  <p>Seorang siswa kelas XI sedang melakukan riset mengenai "dampak emisi
  karbon". Ia
      ingin mencari dokumen laporan resmi berformat PDF yang diterbitkan langsung oleh
      instansi pemerintah Indonesia (domain go.id) agar datanya valid dan kredibel secara
      hukum.</p>
  <p>Sintaks pencarian lanjutan yang paling cepat, akurat, dan akseptabel
  adalah: "dampak
      emisi karbon" site:go.id filetype:pdf</p>
  <ul>
      <li aria-level="1">Analisis Keandalan: Penggunaan domain go.id memberikan jaminan bahwa data statistik
        berasal langsung dari server instansi pemerintah yang sah (memiliki Authority tinggi).</li>
      <li aria-level="1">Analisis Efisiensi: Penulisan frasa dalam tanda petik ganda memastikan pelacakan
        persis, sedangkan filetype:pdf langsung menyaring file dokumen siap pakai tanpa perlu
        menyusuri artikel blog pribadi yang tidak valid.</li>
    </ul>
