  _ngcontent-ng-c784474382="">"Penilaian kevalidan suatu data teks dapat diuji
  secara terstruktur menggunakan instrumen ilmiah yang disebut Metode
  CRAAP<button _ngcontent-ng-c784474382="" panelclass="citation-tooltip-panel"
  dialoglabel="Detail Kutipan" triggerdescription="Klik untuk membuka detail
  kutipan" jslog="219344;track:generic_click,impression,hover"
