    <latihan-kuis mode="siswa" allow-retake max-retake="5" duration="900" timer-autostart shuffle-questions shuffle-choices kategori="formatif" apps-script-url="https://script.google.com/macros/s/AKfycbyuprudZkCq_YCQ-CqqD_huzndsbA6zHsg_ICfqPnlB97dhcrm1xJjGxJ3u4Jp8DjJQ/exec" kd-materi="LD-1 Latihan" student-id="" judul-materi="Materi: Pencarian" teks-materi="Baca materi di atas, lalu kerjakan kuis. Kamu bisa mengulang sampai 4 kali." show-sheet-link soal-file-url="./files/soal-contoh.json" materi-file="" cover-image="" judul-kuis="Evaluasi Kuis Interaktif" student-name="" student-nis="" student-absen="" student-kelas="" pesan-waktu-habis="⏰ Waktu habis! Kuis dikunci &amp; dinilai otomatis." pesan-nilai-terkirim="🎉 Selamat! Nilai Anda sudah terkirim ke spreadsheet." label-mulai="▶️ Mulai" hide-pause-restart questions="[{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Pencarian informasi ilmiah secara daring menggunakan kata kunci sederhana sering kali tidak efektif karena menghasilkan jutaan data tidak relevan. Guna menyaring data secara presisi, pengguna dapat menerapkan variabel pencarian lanjutan seperti site: untuk domain web dan filetype: untuk format berkas. Seorang siswa kelas XI sedang melakukan riset mengenai \&quot;dampak emisi karbon\&quot;. Ia ingin mencari dokumen laporan resmi berformat PDF yang diterbitkan langsung oleh instansi pemerintah Indonesia (domain go.id) agar datanya valid. Sintaks pencarian lanjutan manakah yang paling cepat dan akurat untuk memenuhi kebutuhan tersebut?&quot;,&quot;choices&quot;:[&quot;dampak emisi karbon filetype:pdf site:edu&quot;,&quot;\&quot;dampak emisi karbon\&quot; site:go.id filetype:pdf&quot;,&quot;dampak emisi karbon AND site:go.id OR filetype:pdf&quot;,&quot;site:gov filetype:pdf \&quot;dampak emisi karbon\&quot;&quot;,&quot;inurl:emisi_karbon filetype:doc site:com&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Pencarian informasi ilmiah secara daring menggunakan kata kunci sederhana sering kali tidak efektif karena menghasilkan jutaan data tidak relevan. Selain itu, operator logika boolean (AND, OR, NOT) berperan penting dalam mengaitkan atau mengecualikan konsep penelusuran. Ketika melakukan riset daring, adakalanya kita ingin mengecualikan kata tertentu yang tidak relevan agar tidak muncul di halaman pencarian. Operator logika boolean atau karakter penulisan manakah yang digunakan untuk mengecualikan kata kunci di mesin pencari Google?&quot;,&quot;choices&quot;:[&quot;Operator AND&quot;,&quot;Operator OR&quot;,&quot;Operator NOT atau tanda minus -&quot;,&quot;Tanda petik ganda \&quot;\&quot;&quot;,&quot;Variabel site:&quot;],&quot;correctIndex&quot;:2},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Dalam pencarian lanjut pada mesin pencari Google, apa fungsi utama dari penggunaan tanda petik ganda \&quot;\&quot; di awal dan akhir frasa kata kunci (seperti \&quot;energi terbarukan\&quot;)?&quot;,&quot;choices&quot;:[&quot;Mengonversi dokumen secara otomatis ke format file PDF&quot;,&quot;Melacak halaman web yang judulnya hanya memuat kata kunci tunggal&quot;,&quot;Menginstruksikan mesin pencari untuk melacak frasa kata kunci secara tepat dan persis (Exact Match)&quot;,&quot;Melakukan enkripsi otomatis pada jalur koneksi internet browser&quot;,&quot;Menghapus data cache sementara dari server Google&quot;],&quot;correctIndex&quot;:2},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Pencarian informasi ilmiah secara daring menggunakan kata kunci sederhana sering kali tidak efektif. Seorang peneliti ingin mencari informasi spesifik mengenai \&quot;pemanasan global\&quot; di situs web resmi kementerian/lembaga pemerintah Indonesia (go.id). Sintaks penulisan di mesin pencari yang benar-benar membatasi hasil pencarian hanya pada domain tersebut adalah...&quot;,&quot;choices&quot;:[&quot;\&quot;pemanasan global\&quot; site:go.id&quot;,&quot;pemanasan global OR site:go.id&quot;,&quot;\&quot;pemanasan global\&quot; filetype:go.id&quot;,&quot;intext:pemanasan global site:edu&quot;,&quot;\&quot;pemanasan global\&quot; -site:go.id&quot;],&quot;correctIndex&quot;:0},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Dalam merumuskan strategi pencarian di mesin pencari Google, mengapa penggunaan kata kunci yang terlampau spesifik dan sempit sangat dihindari oleh seorang peneliti?&quot;,&quot;choices&quot;:[&quot;Karena dapat memblokir alamat IP komputer pengguna secara otomatis&quot;,&quot;Karena dapat mematikan konektivitas jaringan nirkabel router publik bawah terminologi yang lebih umum&quot;,&quot;Karena berisiko menghilangkan informasi penting lainnya yang tersedia di bawah terminologi yang lebih umum&quot;,&quot;Karena mengacaukan pengodean biner pada memori cache komputer pengguna umum bawah terminologi&quot;,&quot;Karena memaksa browser mengunduh virus digital secara otomatis umum bawah terminologi yang lebih&quot;],&quot;correctIndex&quot;:2},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Teknologi pencarian modern seperti Google Lens dikembangkan untuk membantu pengguna internet melakukan penelusuran informasi yang tidak terbatas pada teks saja. Penelusuran informasi pada Google Lens didasarkan pada pencocokan...&quot;,&quot;choices&quot;:[&quot;Suara/vokal secara interaktif&quot;,&quot;Gambar/visual yang diunggah pengguna otomatis&quot;,&quot;Enkripsi persandian asimetris satelit publik&quot;,&quot;Koordinat geolokasi satelit secara otomatis&quot;,&quot;Aliran paket data nirkabel jaringan publik&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Di tengah keterbatasan akses internet, seorang siswa ingin melihat versi salinan sementara terbaru dari suatu halaman web yang disimpan oleh server mesin pencari Google. Variabel pencarian lanjutan manakah yang harus ia gunakan?&quot;,&quot;choices&quot;:[&quot;site:&quot;,&quot;filetype:&quot;,&quot;cache:&quot;,&quot;inurl:&quot;,&quot;intitle:&quot;],&quot;correctIndex&quot;:2},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Dalam riset akademis di Indonesia, manakah domain website pengelola di internet yang tergolong kredibel, tepercaya, dan secara resmi dikelola oleh institusi pendidikan tinggi?&quot;,&quot;choices&quot;:[&quot;.com&quot;,&quot;.ac.id&quot;,&quot;.blogspot.com&quot;,&quot;.net&quot;,&quot;.org&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Mengapa penggunaan kata kunci yang tidak berkaitan dengan topik penelitian tidak termasuk dalam langkah-langkah pencarian informasi yang efektif?&quot;,&quot;choices&quot;:[&quot;Karena dapat merusak perangkat keras komputer pengguna secara langsung yang dibutuhkan data pengguna secara berlebihan&quot;,&quot;Karena menghasilkan hasil pencarian yang tidak relevan dengan topik sehingga menyulitkan pencarian informasi yang dibutuhkan&quot;,&quot;Karena otomatis memblokir koneksi internet browser dalam informasi yang dibutuhkan data pengguna secara berlebihan&quot;,&quot;Karena memaksa server Google menghapus data pencarian pengguna secara permanen yang dibutuhkan data pengguna secara berlebihan&quot;,&quot;Karena mempercepat durasi loading halaman web secara berlebihan yang dibutuhkan data pengguna secara berlebihan&quot;],&quot;correctIndex&quot;:1},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Mengapa situs web dengan protokol HTTPS dinilai jauh lebih aman dan kredibel untuk diakses saat menjelajah informasi digital dibandingkan situs HTTP biasa?&quot;,&quot;choices&quot;:[&quot;Karena HTTPS secara otomatis menghapus file duplikat di internet browser dari akses pihak yang tidak sah&quot;,&quot;Karena HTTPS mempercepat proses indexing Google secara real-time di browser pengguna dari akses pihak yang tidak sah&quot;,&quot;Karena HTTPS menggunakan enkripsi SSL/TLS untuk melindungi data pengguna dari akses pihak yang tidak sah&quot;,&quot;Karena HTTPS tidak memerlukan koneksi internet nirkabel untuk loading nirkabel untuk loading secara real-time&quot;,&quot;Karena HTTPS otomatis memblokir iklan pop-up di browser pengguna dari akses pihak yang tidak sah untuk loading&quot;],&quot;correctIndex&quot;:2},{&quot;type&quot;:&quot;pgk&quot;,&quot;question&quot;:&quot;Pencarian informasi ilmiah secara daring menggunakan kata kunci sederhana sering kali tidak efektif karena menghasilkan jutaan data tidak relevan. Tentukan apakah setiap pernyataan berikut Benar atau Salah mengenai aturan, variabel, dan strategi pencarian lanjutan di mesin pencari!&quot;,&quot;statements&quot;:[{&quot;text&quot;:&quot;Variabel filetype:pdf berfungsi secara presisi untuk membatasi atau menyaring hasil pencarian Google agar hanya menampilkan berkas berformat dokumen PDF.&quot;,&quot;answer&quot;:true},{&quot;text&quot;:&quot;Operator logika boolean OR digunakan untuk mempersempit hasil pencarian secara drastis dengan memaksa mesin pencari menampilkan halaman yang hanya memuat semua kata kunci sekaligus.&quot;,&quot;answer&quot;:false},{&quot;text&quot;:&quot;Penggunaan variabel intitle:riset membatasi penelusuran agar mesin pencari hanya menampilkan halaman web yang judul dokumennya mengandung kata \&quot;riset\&quot;.&quot;,&quot;answer&quot;:true},{&quot;text&quot;:&quot;Memasukkan kata kunci pencarian yang tidak berkaitan sangat disarankan karena dapat menghemat waktu riset serta meningkatkan efisiensi penyaringan informasi ilmiah.&quot;,&quot;answer&quot;:false},{&quot;text&quot;:&quot;Penggunaan kata kunci pencarian yang terlampau spesifik atau sempit di awal penelusuran dihindari karena berisiko menghilangkan informasi penting lain yang menggunakan istilah umum.&quot;,&quot;answer&quot;:true},{&quot;text&quot;:&quot;Variabel inurl:jurnal digunakan untuk mengunci pelacakan kata kunci \&quot;jurnal\&quot; khusus hanya di dalam badan teks (body text) halaman web.&quot;,&quot;answer&quot;:false}]},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Pencarian informasi ilmiah secara daring menggunakan kata kunci sederhana sering kali tidak efektif. Manakah dua pernyataan berikut yang benar mengenai fungsi dari operator logika boolean dan format pencarian di mesin pencari Google?&quot;,&quot;choices&quot;:[&quot;Operator AND berfungsi menggabungkan beberapa kata kunci guna mempersempit ruang lingkup pencarian data.&quot;,&quot;Operator OR berfungsi membatasi penelusuran agar hanya menampilkan hasil berkas dari domain militer .mil.&quot;,&quot;Operator NOT atau tanda minus - digunakan untuk mengecualikan kata kunci tertentu yang tidak berkaitan dari halaman pencarian.&quot;,&quot;Penggunaan tanda petik ganda \&quot;\&quot; secara otomatis melacak versi salinan sementara terbaru halaman web di server.&quot;],&quot;correctAnswers&quot;:[0,2]},{&quot;type&quot;:&quot;mc&quot;,&quot;question&quot;:&quot;Pencarian informasi ilmiah secara daring menggunakan kata kunci sederhana sering kali tidak efektif. Seorang siswa ingin mencari data ilmiah mengenai \&quot;teknologi pangan\&quot; yang diterbitkan secara resmi oleh perguruan tinggi di Indonesia (ac.id). Manakah dua sintaks pencarian lanjutan yang sah dan benar-benar membatasi pelacakan hanya ke situs web perguruan tinggi Indonesia tersebut?&quot;,&quot;choices&quot;:[&quot;\&quot;teknologi pangan\&quot; site:ac.id&quot;,&quot;\&quot;teknologi pangan\&quot; filetype:ac.id&quot;,&quot;site:ac.id intext:\&quot;teknologi pangan\&quot;&quot;,&quot;\&quot;teknologi pangan\&quot; OR site:edu&quot;],&quot;correctAnswers&quot;:[0,2]},{&quot;type&quot;:&quot;matching&quot;,&quot;question&quot;:&quot;Pasangkanlah variabel pencarian lanjutan Google di lajur kiri dengan deskripsi penjelasannya yang tepat di lajur kanan!&quot;,&quot;leftItems&quot;:[&quot;site:&quot;,&quot;filetype:&quot;,&quot;inurl:&quot;,&quot;intitle:&quot;],&quot;rightItems&quot;:[&quot;Melacak kata kunci spesifik yang tertanam di dalam alamat URL halaman web.&quot;,&quot;Membatasi hasil pencarian hanya pada alamat web atau domain tertentu (seperti .go.id atau .ac.id).&quot;,&quot;Menyaring hasil pencarian berdasarkan format dokumen berkas tertentu seperti PDF, DOC, atau PPT.&quot;,&quot;Membatasi pencarian halaman web yang judul dokumennya mengandung kata kunci tertentu.&quot;,&quot;Menghapus seluruh riwayat (history) penelusuran peramban internet secara otomatis.&quot;],&quot;correctPairs&quot;:{&quot;0&quot;:1,&quot;1&quot;:2,&quot;2&quot;:0,&quot;3&quot;:3}}]" _attempt-ke="0"  ></latihan-kuis>

