  cdk-describedby-host="ng-1"></button>. Metode ini membagi evaluasi ke dalam
  lima indikator utama, yaitu <i _ngcontent-ng-c784474382="">Currency</i>
  (keaktualan), <i _ngcontent-ng-c784474382="">Relevance</i> (relevansi), <i
  _ngcontent-ng-c784474382="">Authority</i> (otoritas), <i
  _ngcontent-ng-c784474382="">Accuracy</i> (keakuratan), dan <i
  _ngcontent-ng-c784474382="">Purpose</i> (tujuan)<button
  _ngcontent-ng-c784474382="" panelclass="citation-tooltip-panel"
  dialoglabel="Detail Kutipan" triggerdescription="Klik untuk membuka detail
  kutipan" jslog="219344;track:generic_click,impression,hover"
  aria-haspopup="dialog" aria-describedby="cdk-describedby-message-ng-1-60"
  cdk-describedby-host="ng-1"></button>. Melalui pemahaman CRAAP, siswa dilatih
  berpikir kritis agar tidak mudah terjebak oleh opini subjektif atau klaim
  sepihak yang tidak didukung bukti ilmiah teruji<button
  _ngcontent-ng-c784474382="" panelclass="citation-tooltip-panel"
