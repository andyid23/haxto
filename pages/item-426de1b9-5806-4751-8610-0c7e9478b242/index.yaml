  <p><b>Membaca Lateral mengajarkan kita untuk tidak langsung memercayai isi
  satu situs web, melainkan melompat antar-tab guna melacak reputasi luar dan
  mencari konsensus sumber independen</b><b>.</b></p>

  <p><b>Validitas ilmiah data dapat diperkuat dengan menghindari bias
  konfirmasi, merujuk pada situs berdomain resmi (.go.id atau .ac.id), serta
  memilih rujukan yang telah melalui peninjauan sejawat
