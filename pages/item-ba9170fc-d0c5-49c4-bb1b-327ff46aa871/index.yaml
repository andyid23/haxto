  <div class="petunjuk">
     <h2>📘 Cara Memasukkan Nilai ke Google Spreadsheet</h2>

    <ol>
      <li>Siapkan <strong>Google Apps Script</strong> (Web App) yang menerima <code>action=logActivity</code> dan
        menulis ke Spreadsheet. Salin URL-nya.</li>

      <li>Tempel URL tersebut ke atribut <code>apps-script-url</code> di bawah (atau atur lewat
        panel HAX: <em>URL Apps Script (kirim nilai)</em>).</li>

      <li>Siswa <strong>login</strong> dulu via <code>&lt;quiz-user-auth&gt;</code> agar nilai
        terikat ke Student ID (lihat kotak auth di bawah).</li>

      <li>Kartu hasil muncul di <strong>dua jalur</strong>: (a) siswa menjawab semua soal &#38;
        submit manual, <em>atau</em> (b) <code>timer-kuis</code> habis. Di kedua jalur, <code>&lt;kuis-ledakan&gt;</code> mengirim
        skor lalu <code>&lt;latihan-kuis&gt;</code>
  menampilkan kartu "Nilai terkirim" + skor.</li>

      <li><strong>Link sheet opt-in (default OFF):</strong> tombol "Buka Spreadsheet Nilai"
        hanya muncul bila atribut <code>show-sheet-link="true"</code> DAN <code>spreadsheet-url</code> diisi.
        Aktifkan hanya untuk guru / view agregat aman, sebab siswa bisa lihat isi sheet.
        Di demo ini sudah diaktifkan.</li>

      <li><strong>Login diwajibkan (anti hilang nilai):</strong> form login (<code>&lt;quiz-user-auth&gt;</code>)
        sudah <em>tertanam di dalam</em> elemen ini. Tombol "Mulai" dikunci sampai siswa login
        (H1/H2). Bila kuis dipaksa tanpa login, kartu hasil menampilkan peringatan "Nilai
        belum tersimpan karena belum login" dan tidak ada baris baru di Spreadsheet (H3).
        Kode materi diteruskan ke <code>&lt;kuis-ledakan&gt;</code> lewat <code>kd-materi</code> (H4).</li>

      <li><strong>Edit / upload soal:</strong> soal bisa diketik langsung lewat panel HAX (<em>Soal (JSON)</em>,
        inputMethod <code>code-editor</code>) atau diunggah dari file via <em>Upload File Soal (JSON)</em> (<code>haxupload</code> &#8594;
        atribut <code>soal-file-url</code>). Bila <code>soal-file-url</code> berhasil di-parse,
        isinya <em>menimpa</em> soal inline; bila file rusak/cosong, soal inline tetap dipakai
        dan pesan error tampil di atas kuis.</li>

      <li>Cek hasil di Spreadsheet lewat atribut <code>spreadsheet-url</code>
  (tombol "Buka
        Spreadsheet Nilai" di layar akhir, bila <code>show-sheet-link</code> aktif).</li>

    </ol>
   <strong>URL Apps Script (contoh — ganti dengan milik Anda):</strong>

